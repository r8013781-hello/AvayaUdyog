name: Keep backend warm

# The Express backend runs on Render's free tier, which spins down after 15
# minutes of no inbound traffic; the next request then pays a 30-60s cold
# start. That delay used to land on a real visitor's enquiry submit (see
# lib/api.js). Pinging the cheap health route often enough that the instance
# never sees 15 idle minutes keeps it warm without touching the enquiry rate
# limit (backend/server.js only throttles /api/enquiries).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 55 https://avayaudyog.onrender.com/api/health
